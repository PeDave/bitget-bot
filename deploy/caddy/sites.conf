# Alternative: Separate site configurations
# Place these files in /etc/caddy/sites/ and include them in your main Caddyfile
# with: import /etc/caddy/sites/*

# File: /etc/caddy/sites/api.conf
api.labotkripto.com {
    reverse_proxy localhost:3001
    log {
        output file /var/log/caddy/api.labotkripto.com.log
    }
}

# File: /etc/caddy/sites/web.conf
labotkripto.com {
    reverse_proxy localhost:3000
    log {
        output file /var/log/caddy/labotkripto.com.log
    }
}

www.labotkripto.com {
    redir https://labotkripto.com{uri} permanent
}

# File: /etc/caddy/sites/n8n.conf
n8n.labotkripto.com {
    reverse_proxy localhost:5678
    log {
        output file /var/log/caddy/n8n.labotkripto.com.log
    }
}
